[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dire-evoc"
version = "0.1.0"
description = "DiRe-RAPIDS layouts + EVoC density clustering: GPU Phase-2 hybrid, intrinsic dimension, out-of-sample predict"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Igor Rivin", email = "rivin@temple.edu"}]
keywords = ["clustering", "dimensionality-reduction", "intrinsic-dimension", "hdbscan", "gpu", "rapids", "evoc", "dire"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
# Pure-numpy cores (dimension, predict) need only these; GPU/cluster deps are lazy.
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
# the EVoC layer post-process for the hybrid path (Igor's fork)
cluster = ["evoc"]
# DiRe-RAPIDS reducer (provides the GPU layout + kNN graph)
dire = ["dire-rapids"]
# GPU single-linkage tree + device kNN
rapids = ["cuml-cu12>=23.0.0", "cuvs-cu12>=23.0.0", "cupy-cuda12x>=10.0.0"]
dev = ["pytest>=7.0.0", "pytest-timeout>=2.1.0"]

[tool.setuptools.packages.find]
include = ["dire_evoc*"]

[project.urls]
Repository = "https://github.com/igorrivin/dire-evoc"
