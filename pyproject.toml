[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dire-evoc"
version = "0.1.0"
description = "DiRe-RAPIDS layouts + EVoC density clustering: GPU Phase-2 hybrid, intrinsic dimension, out-of-sample predict"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Igor Rivin", email = "rivin@temple.edu"}]
requires-python = ">=3.10"
keywords = ["clustering", "dimensionality-reduction", "intrinsic-dimension", "hdbscan", "gpu", "rapids", "evoc", "dire"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Pure-numpy cores (dimension, predict, pipeline orchestration) need only these; the
# GPU/cluster dependencies are imported lazily inside the functions that use them.
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
# the EVoC layer post-process for the hybrid path (Igor's fork)
cluster = ["evoc"]
# DiRe-RAPIDS reducer (provides the GPU layout + kNN graph)
dire = ["dire-rapids"]
# Integration support for an environment where RAPIDS itself is already installed (for
# example, a conda RAPIDS environment). This intentionally does not install CUDA wheels.
rapids = ["hdbscan>=0.8.40"]
# Complete pip-managed RAPIDS stacks. Pick exactly one matching the environment's CUDA
# major; cuML exposes its fitted single-linkage tree through the CPU hdbscan package.
rapids-cu12 = [
    "cuml-cu12>=26.2,<27",
    "cuvs-cu12>=26.2,<27",
    "cupy-cuda12x>=14,<15",
    "hdbscan>=0.8.40",
]
rapids-cu13 = [
    "cuml-cu13>=26.2,<27",
    "cuvs-cu13>=26.2,<27",
    "cupy-cuda13x>=14,<15",
    "hdbscan>=0.8.40",
]
dev = ["pytest>=7.0.0", "pytest-cov", "pytest-timeout>=2.1.0", "black", "ruff"]
docs = ["sphinx>=7.0.0", "matplotlib>=3.8.0"]

[project.urls]
Homepage = "https://github.com/igorrivin/dire-evoc"
Repository = "https://github.com/igorrivin/dire-evoc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by black
