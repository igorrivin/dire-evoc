name: Documentation

# Deployment prerequisite:
# 1. Enable GitHub Pages in repository Settings and select "GitHub Actions" as the source.
# 2. Add repository variable PAGES_ENABLED=true to turn on the configure/upload/deploy steps.
# The workflow always builds Sphinx, but Pages-specific steps stay gated until the repo is
# explicitly configured because GITHUB_TOKEN cannot create a Pages site for first-time setup.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'

      - name: Configure Pages
        if: ${{ vars.PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v5

      - name: Build Sphinx documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: ${{ vars.PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
