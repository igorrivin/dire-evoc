# Continuous Integration
# Runs on every push and PR.
#
# Note: GitHub runners have no GPU, so the cuml/dire-rapids/evoc paths cannot run
# here. The pure-numpy cores (dimension, predict) are fully exercised; the GPU
# pipeline/hybrid tests skip themselves via pytest.importorskip. Only the base
# (CPU) dependencies are installed.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check src tests

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Verify imports
        run: |
          python -c "import dire_evoc; print(f'Version: {dire_evoc.__version__}')"
